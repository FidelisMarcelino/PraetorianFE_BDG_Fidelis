<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Products</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body>
    <div>
        <a href="index.html">
            <button class="p-1 rounded-sm cursor-pointer bg-red-700 text-white m-2 font-semibold">Back</button>
        </a>
    </div>
    <div class="max-w-md mx-auto mt-20 bg-white p-6 rounded shadow">
        <h2 class="text-2xl font-bold text-center text-violet-700">Add New Products</h2>

        <form id="productForm" class="flex flex-col gap-2">
            <input type="text" id="title" placeholder="Product Title" class="border p-2 rounded">

            <input type="number" id="price" placeholder="Price" class="border p-2 rounded">

            <input type="text" id="description" placeholder="Description" class="border p-2 rounded">

            <input type="text" id="image" placeholder="Image URL" class="border p-2 rounded">

            <button type="submit" class="bg-violet-700 text-white py-2 rounded hover:bg-violet-800">Submit</button>

            <!-- Untuk memberikan output menandakan add product sukses -->
            <p id="message" class="text-center mt-2"></p>
        </form>
    </div>
</body>
<script src="form.js"></script>
</html>
