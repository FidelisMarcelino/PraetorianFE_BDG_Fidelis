<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <a href="index.html">
        <button class="text-white bg-red-700 p-1 m-2 rounded-sm font-semibold cursor-pointer">Back</button>
    </a>

    <div class="max-w-md mx-auto mt-20 bg-white p-6 rounded shadow">
        <h2 class="text-2xl font-bold text-center text-violet-700">Add New Product</h2>

        <form id="productForm" class="flex flex-col gap-3">
            <input type="text" id="title" placeholder="Product Title" class="border p-2 rounded">

            <input type="number" id="price" placeholder="Price" class="border p-2 rounded">

            <input type="text" id="description" placeholder="Description" class="border p-2 rounded">

            <input type="text" id="image" placeholder="Image URL" class="border p-2 rounded">

            <button type="submit" class="bg-violet-700 text-white py-2 rounded hover:bg-violet-800">Submit</button>

            <p id="message" class="text-center mt-2"></p>
        </form>
    </div>

    <script src="form.js"></script>
</body>
</html>
